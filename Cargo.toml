# Standalone — see top-level Cargo.toml for why it's not a workspace member.
# This crate ships the library-only surface used by the B1 adapter. Upstream
# shipped server/CLI/ethereum-db/mmap scaffolding; the Raven fork stripped
# that surface because (a) the B1 adapter consumes only the library, and
# (b) those modules carry transitive tokio/axum/reqwest deps that break
# wasm32-unknown-unknown. Detached workspace; built explicitly with:
#   cargo build --manifest-path crates/raven-inspire/Cargo.toml --release
[workspace]

[package]
name = "raven-inspire"
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.89"
description = "Raven's fork of inspire-rs (igor53627) with Raven-local patches for known upstream issues and client-side query-path caching."
license = "Apache-2.0"
authors = ["Raven contributors", "Original inspire-rs authors (see UPSTREAM.md)"]
publish = false
readme = "README.md"

# AVX-512 / IFMA52 kernels are intrinsic-based and feature-gated.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }

# Runtime library paths must return typed errors. `clippy.toml` exempts test
# code, so arming these costs no coverage.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Backticking every identifier in prose churns ~490 doc sites without changing
# a single contract.
doc_markdown = "allow"
# No API here has an ignore-the-return footgun; #[must_use] on ~260 pure
# accessors is noise.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# Modular arithmetic mixes u64/u128/i64/usize by design; every reduction step
# is a deliberate width change, and ~480 per-site allows would bury the ones
# that matter. Narrowing casts on index/size paths are checked instead - see
# `ShardConfig::try_index_to_shard`.
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Symbol names track the papers this crate ports (a, b, e, s, q, u, y).
similar_names = "allow"
many_single_char_names = "allow"
# Error and panic contracts are documented where they are load-bearing; the
# blanket form would add ~100 doc blocks against the house comment budget.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Moduli and NTT constants read better in the grouping the source paper uses.
unreadable_literal = "allow"
unusual_byte_groupings = "allow"
# NTT, packing and mod-switch kernels are long and wide by nature; splitting
# them to satisfy a line or argument count would hide the dataflow.
too_many_lines = "allow"
too_many_arguments = "allow"
# Helper fns declared next to their single use site read better than hoisted.
items_after_statements = "allow"
# The unsafe in this crate is AVX-512 intrinsics, reachable only through CPUID
# dispatch and unrelated to any derived Deserialize.
unsafe_derive_deserialize = "allow"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Parallelism (server-only; the default/wasm build uses the sequential fallback)
rayon = { version = "1.10", optional = true }

# Cryptographic primitives
rand = "0.8"
rand_chacha = "0.3"
# Constant-time selects/compares. Default features deliberately: its barrier is
# an out-of-line volatile read, which `core::hint::black_box` is not, and that is
# what stops LLVM re-introducing a branch on a secret operand. Costs ~2x on the
# Gaussian table scan and ~2% end to end.
subtle = "2.6"

# WASM browser support for `rand::thread_rng()` / `OsRng`. On
# wasm32-unknown-unknown the `getrandom` crate (transitively pulled by
# `rand` / `rand_chacha`) refuses to compile without an explicit backend;
# the `js` feature wires it to the browser's `crypto.getRandomValues`.
# Native targets are unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
default = []
# Server-only: parallelize the respond / packing-offline hot loops with rayon.
# Default OFF so the client/wasm build pulls no rayon and uses the sequential
# fallback (output byte-identical to the parallel path - the loops are pure
# order-preserving maps over public data). The server enables this explicitly.
parallel = ["dep:rayon"]
# Enable AVX-512-IFMA52 multiply-accumulate dispatch in the
# packing-offline hot kernel (`Poly::mul_acc_ntt_domain`). Default OFF;
# safe to enable on any target — runtime CPUID gates the dispatch and
# the scalar path remains for non-x86_64 / pre-IFMA52 hosts.
simd-packing-offline = []
# Spiral-style server-side response mod-switching. Off by default for
# backward compatibility; downstream consumers must opt in. See
# `src/pir/mod_switch.rs` for the algorithm and noise-budget gate.
mod-switch-response = []

[dev-dependencies]
proptest = "1.4"

[[bench]]
name = "query_latency_bench"
path = "benches/query_latency_bench.rs"
harness = false

[[bench]]
name = "spiral_mod_switch_bench"
path = "benches/spiral_mod_switch_bench.rs"
required-features = ["mod-switch-response"]
harness = false
